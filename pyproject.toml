[project]
name = "scanner-backend"
version = "0.1.0"
description = "Vulnerability scanning backend (Nuclei + OpenVAS, parallel execution)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "python-gvm>=27.7.0",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
