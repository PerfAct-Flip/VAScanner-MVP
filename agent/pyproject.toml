[project]
name = "presence-agent"
version = "0.1.0"
description = "On-site agent that discovers and scans a customer's internal network on behalf of the vulnerability scanner backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "paramiko>=3.4.0",
]

[project.scripts]
presence-agent = "presence_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
